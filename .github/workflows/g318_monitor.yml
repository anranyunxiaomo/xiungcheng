name: G318川西路况与实时天气监控

on:
  # 项目已根据用户指令暂停定时任务
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor_g318:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 配置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行30分钟云端巡查与突发路况实时主动推送
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_USER_OPENID: ${{ secrets.WECHAT_USER_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
        run: |
          python g318_monitor.py
